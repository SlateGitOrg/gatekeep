# Demo OIDC provider for local runs. Passwords: alice-pw, bob-pw, carol-pw
# (hashes generated by `gatekeep-idp hash-password`). Not for real use.
issuer: https://127.0.0.1:9443
listen: 127.0.0.1:9443
cert_file: tls.crt
key_file: tls.key
token_ttl: 5m
rotate_every: 0s
clients:
  - id: gatekeep
    secret_env: GATEKEEP_CLIENT_SECRET
    redirect_uris: [https://127.0.0.1:8443/.gatekeep/callback]
users:
  - {username: alice, subject: user-alice, email: alice@example.test, email_verified: true, name: Alice, groups: [eng, admins], password_hash: "ALICE_HASH"}
  - {username: bob, subject: user-bob, email: bob@example.test, email_verified: true, name: Bob, groups: [eng], password_hash: "BOB_HASH"}
  - {username: carol, subject: user-carol, email: carol@contractor.test, email_verified: true, name: Carol, groups: [contractors], password_hash: "CAROL_HASH"}
